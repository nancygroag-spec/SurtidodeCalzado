<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Calzado Surtido</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background: #0b0f19; color: #fff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">

    <div style="background: #111418; padding: 30px; border-radius: 12px; border: 1px solid rgba(0, 242, 254, 0.3); width: 340px; text-align: center;">
        <h2 style="color: #00f2fe; margin-bottom: 10px;">Inicio de sesión</h2>
        <p style="font-size: 13px; color: #aaa; margin-bottom: 20px;">Ingresa tus credenciales para acceder al catálogo exclusivo</p>
        
        {% if error %}
            <p style="color: #ff4d4d; font-size: 13px; margin-bottom: 15px;">{{ error }}</p>
        {% endif %}

        <!-- Agregamos autocomplete="off" y un identificador para evitar que el navegador guarde la contraseña -->
        <form method="POST" autocomplete="off">
            
            <div style="text-align: left; margin-bottom: 12px;">
                <label style="font-size: 13px; color: #ccc;">Usuario</label>
                <input type="text" name="usuario" value="" placeholder="Escribe tu usuario..." required autocomplete="off" style="width: 100%; padding: 10px; margin-top: 5px; background: #1a222d; border: 1px solid #333; border-radius: 6px; color: #fff; box-sizing: border-box;">
            </div>

            <div style="text-align: left; margin-bottom: 20px;">
                <label style="font-size: 13px; color: #ccc;">Contraseña</label>
                <input type="password" name="password" value="" placeholder="••••••" required autocomplete="new-password" style="width: 100%; padding: 10px; margin-top: 5px; background: #1a222d; border: 1px solid #333; border-radius: 6px; color: #fff; box-sizing: border-box;">
            </div>
            
            <button type="submit" style="width: 100%; padding: 12px; background: #00f2fe; color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 15px;">INGRESAR</button>
        </form>

        <!-- BOTÓN DE ACCESO PARA VISITANTES / OBSERVADORES -->
        <div style="margin-top: 15px;">
            <a href="{{ url_for('catalogo') }}" style="display: block; width: 100%; padding: 10px; background: transparent; color: #00f2fe; border: 1px solid #00f2fe; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 13px; box-sizing: border-box;">
                👀 Entrar como Visitante (Solo ver catálogo)
            </a>
        </div>

        <p style="margin-top: 20px; font-size: 13px;">¿Eres mayorista y no tienes cuenta? <a href="{{ url_for('registro') }}" style="color: #00f2fe; text-decoration: none;">Regístrate aquí</a></p>
    </div>

</body>
</html>
