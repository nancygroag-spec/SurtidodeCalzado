<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro Mayorista - Calzado Surtido</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background: #0b0f19; color: #fff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">

    <div style="background: #111418; padding: 30px; border-radius: 12px; border: 1px solid rgba(0, 242, 254, 0.3); width: 340px; text-align: center;">
        <h2 style="color: #00f2fe; margin-bottom: 20px;">Registro de Mayorista</h2>
        
        <form method="POST" autocomplete="off">
            
            <div style="text-align: left; margin-bottom: 12px;">
                <label style="font-size: 13px; color: #ccc;">Nombre y Apellido (Será tu usuario)</label>
                <input type="text" name="nombre" placeholder="Ej. Juan Perez" required autocomplete="off" style="width: 100%; padding: 10px; margin-top: 5px; background: #1a222d; border: 1px solid #333; border-radius: 6px; color: #fff; box-sizing: border-box;">
            </div>

            <div style="text-align: left; margin-bottom: 20px;">
                <label style="font-size: 13px; color: #ccc;">Número de Teléfono (Será tu contraseña)</label>
                <input type="tel" name="telefono" placeholder="Ej. 8991234567" required autocomplete="new-password" style="width: 100%; padding: 10px; margin-top: 5px; background: #1a222d; border: 1px solid #333; border-radius: 6px; color: #fff; box-sizing: border-box;">
            </div>
            
            <button type="submit" style="width: 100%; padding: 12px; background: #00f2fe; color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 15px;">Crear Cuenta</button>
        </form>

        <p style="margin-top: 20px; font-size: 13px;">¿Ya tienes cuenta? <a href="{{ url_for('login') }}" style="color: #00f2fe; text-decoration: none;">Inicia sesión aquí</a></p>
    </div>

</body>
</html>
